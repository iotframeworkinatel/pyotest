services:
  ftp_anonymous:
    # pinned: tag unchanged on Docker Hub since 2023-01-27 (same image used in the experiments)
    image: fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
    container_name: ftp_anonymous
    environment:
      - FTP_USER=admin
      - FTP_PASS=admin
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.10

  ftp_credentials_vuln:
    # TODO(reproducibility): 'latest' was rebuilt on 2026-11-15, after the experiments.
    # Replace with the version tag used in the campaign (e.g. stilliard/pure-ftpd:<distro>-1.0.xx).
    image: stilliard/pure-ftpd
    container_name: ftp_credentials_vuln
    ports:
      - "2121:21"
    environment:
      FTP_USER_NAME: admin
      FTP_USER_PASS: admin
      FTP_USER_HOME: /home/admin
      FTP_ALLOW_ANON: "true"
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.20

  http_traversal:
    build: ./emergence/devices/http-vuln
    container_name: http_traversal
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.11

  telnet_insecure:
    build: ./emergence/devices/telnetd
    container_name: telnet_insecure
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.12

  ftp_banner:
    # pinned: tag unchanged on Docker Hub since 2021-06-26
    image: stilliard/pure-ftpd:hardened@sha256:1d15f8091b18d399178acc47559b9328c3deecca732d52df96e65303d6a8a966
    container_name: ftp_banner
    environment:
      - PUBLICHOST=172.20.0.13
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.13

  http_admin_default_creds:
    build: ./emergence/devices/app-admin-panel
    container_name: http_admin_default_creds
    volumes:
      - ./simulation:/app/simulation
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.14

  http_directory_listing:
    image: httpd:2.4
    container_name: http_directory_listing
    volumes:
      - ./emergence/devices/httpd/conf.d/directory-listing.conf:/usr/local/apache2/conf/conf.d/directory-listing.conf
      - ./emergence/devices/httpd/htdocs:/usr/local/apache2/htdocs
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.15

  mqtt_no_auth:
    build: ./emergence/devices/mqtt
    container_name: mqtt_no_auth
    ports:
      - "1883:1883"
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.16

  ssh_old_banner:
    # pinned: tag unchanged on Docker Hub since 2018-05-20
    image: rastasheep/ubuntu-sshd:latest@sha256:1a4010f95f6b3292f95fb26e442f85885d523f9a0bb82027b718df62fdd0d9e9
    container_name: ssh_old_banner
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.17

  h2o-automl:
    # pinned to the H2O version recorded in models/archive/h2o_*/model_binary (3.46.0.9);
    # the Python h2o client must match this server version
    image: h2oai/h2o-open-source-k8s-minimal:3.46.0.9
    container_name: h2o-automl
    cpus: 16
    ports:
      - "54321:54321"
    environment:
      - JAVA_OPTS=-Xmx16g -Xms4g
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.18

  coap_vuln:
    build: ./emergence/devices/coap
    container_name: coap_vuln
    volumes:
      - ./simulation:/app/simulation
    ports:
      - "5683:5683/udp"
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.21

  modbus_vuln:
    build: ./emergence/devices/modbustcp
    container_name: modbus_vuln
    volumes:
      - ./simulation:/app/simulation
    ports:
      - "502:502"
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.22

  http_api_vuln:
    build: ./emergence/devices/http-api-vuln
    container_name: http_api_vuln
    volumes:
      - ./simulation:/app/simulation
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.23

  dns_vuln:
    build: ./emergence/devices/dns-vuln
    container_name: dns_vuln
    restart: unless-stopped
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.24

  # ── AutoML Framework Containers ──────────────────────────────────────

  autogluon-server:
    build:
      context: .
      dockerfile: docker/autogluon/Dockerfile
    container_name: autogluon_server
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./models:/app/models
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.25

  pycaret-server:
    build:
      context: .
      dockerfile: docker/pycaret/Dockerfile
    container_name: pycaret_server
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./models:/app/models
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.26

  tpot-server:
    build:
      context: .
      dockerfile: docker/tpot/Dockerfile
    container_name: tpot_server
    restart: unless-stopped
    ports:
      - "8084:8084"
    volumes:
      - ./models:/app/models
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.27

  autosklearn-server:
    build:
      context: .
      dockerfile: docker/autosklearn/Dockerfile
    container_name: autosklearn_server
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./models:/app/models
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.28

  scanner:
    build: .
    user: root
    container_name: scanner
    restart: unless-stopped
    depends_on:
      - ftp_anonymous
      - http_traversal
      - telnet_insecure
      - ftp_banner
      - http_admin_default_creds
      - http_directory_listing
      - mqtt_no_auth
      - ssh_old_banner
      - h2o-automl
      - ftp_credentials_vuln
      - coap_vuln
      - modbus_vuln
      - http_api_vuln
      - dns_vuln
    volumes:
      - ./report:/app/report
      - ./experiments:/app/experiments/
      - ./suites:/app/suites
      - ./templates:/app/templates
      - ./results:/app/results
      - ./utils:/app/utils
      - ./models:/app/models
      - ./generator:/app/generator
      - ./history:/app/history
      - ./simulation:/app/simulation
    networks:
      iot_bridge:
        ipv4_address: 172.20.0.19
    command: tail -f /dev/null  # scanner fica ativo aguardando instruções



  #### EMERGENCE DASHBOARD #####

  dashboard-api:
    build: ./dashboard/backend
    container_name: dashboard_api
    restart: always
    env_file:
      - .env
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - ./experiments:/app/experiments
        - ./generator:/app/generator
        - ./models:/app/models
        - ./automl:/app/automl
        - ./utils:/app/utils
        - ./templates:/app/templates
        - ./suites:/app/suites
        - ./results:/app/results
        - ./simulation:/app/simulation
        - ./history:/app/history
    ports:
      - "8080:8000"
      - "8000:8000"
    depends_on:
      - scanner
    networks:
      - iot_bridge

  dashboard-ui:
    build: ./dashboard/frontend
    container_name: dashboard_ui
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - API_URL=http://backend:8000   # backend acessível via compose
    depends_on:
      - dashboard-api
    networks:
      - iot_bridge

networks:
  iot_bridge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24